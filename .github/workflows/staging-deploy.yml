name: Staging Environment Deployment

on:
  push:
    branches: [develop, staging]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.8'

jobs:
  # Deploy to staging for feature branches and PRs
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install pnpm
        run: |
          npm i -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        id: vercel-preview
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-comment: true
          vercel-args: '--env DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" --env OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" --env NEXTAUTH_SECRET="${{ secrets.STAGING_NEXTAUTH_SECRET }}"'

      - name: Run staging database migrations
        run: |
          pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Health check staging deployment
        run: |
          sleep 30
          curl -f ${{ steps.vercel-preview.outputs.preview-url }}/api/health || exit 1

      - name: Run smoke tests
        run: pnpm test:smoke --baseURL=${{ steps.vercel-preview.outputs.preview-url }}

      - name: Comment PR with staging URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Staging deployment ready!
              
              **Preview URL:** ${{ steps.vercel-preview.outputs.preview-url }}
              
              **Test the following:**
              - [ ] AI deck generation workflow
              - [ ] Mobile responsiveness
              - [ ] Performance and loading times
              - [ ] Error handling
              
              **Automated checks:**
              - ✅ Health checks passed
              - ✅ Smoke tests passed
              `
            })

  # Cleanup old staging deployments
  cleanup-staging:
    name: Cleanup Old Staging Deployments
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Cleanup old deployments
        run: |
          # Keep only the last 5 staging deployments
          curl -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&limit=20" \
            | jq -r '.deployments[] | select(.target != "production") | .uid' \
            | tail -n +6 \
            | xargs -I {} curl -X DELETE \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v13/deployments/{}"