name: Production Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.8'

jobs:
  # Quality Gates - Run tests and checks
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type checking
        run: pnpm type-check

      - name: Linting
        run: pnpm lint

      - name: Unit tests
        run: pnpm test --run

      - name: Integration tests
        run: pnpm test:integration --run
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Build application
        run: pnpm build

      - name: Security audit
        run: pnpm audit --audit-level moderate

      - name: Bundle analysis
        run: pnpm analyze

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/web/.next
            packages/*/dist
          retention-days: 7

  # E2E Tests on staging-like environment
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 45
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Setup test database
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed:test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e --reporter=html
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          NEXTAUTH_SECRET: test-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # Performance and Load Testing
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run performance tests
        run: pnpm test:performance --run
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results/
          retention-days: 7

  # Deploy to Staging Environment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality-gates, e2e-tests, performance-tests]
    if: github.ref == 'refs/heads/main'
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Staging
        uses: amondnet/vercel-action@v25
        id: vercel-staging
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--env DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" --env OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" --env NEXTAUTH_SECRET="${{ secrets.STAGING_NEXTAUTH_SECRET }}"'

      - name: Run staging database migrations
        run: |
          pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Health check staging deployment
        run: |
          sleep 30
          curl -f ${{ steps.vercel-staging.outputs.preview-url }}/api/health || exit 1
          curl -f ${{ steps.vercel-staging.outputs.preview-url }}/api/health/detailed || exit 1

      - name: Run smoke tests on staging
        run: pnpm test:smoke --baseURL=${{ steps.vercel-staging.outputs.preview-url }}

      - name: Store staging URL
        run: echo "STAGING_URL=${{ steps.vercel-staging.outputs.preview-url }}" >> $GITHUB_ENV

  # Production Deployment with Blue-Green Strategy
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pre-deployment health check
        run: |
          curl -f https://moxmuse.com/api/health || echo "Current production may be down"

      - name: Run production database migrations
        run: |
          pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Vercel Production (Blue-Green)
        uses: amondnet/vercel-action@v25
        id: vercel-production
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --env DATABASE_URL="${{ secrets.DATABASE_URL }}" --env OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" --env NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" --env SENTRY_DSN="${{ secrets.SENTRY_DSN }}"'

      - name: Wait for deployment propagation
        run: sleep 60

      - name: Post-deployment health checks
        id: health-check
        run: |
          echo "Running comprehensive health checks..."
          
          # Basic health check
          if ! curl -f https://moxmuse.com/api/health; then
            echo "Basic health check failed"
            exit 1
          fi
          
          # Detailed health check
          if ! curl -f https://moxmuse.com/api/health/detailed; then
            echo "Detailed health check failed"
            exit 1
          fi
          
          # Database connectivity
          if ! curl -f https://moxmuse.com/api/health/database; then
            echo "Database health check failed"
            exit 1
          fi
          
          # AI service connectivity
          if ! curl -f https://moxmuse.com/api/health/ai; then
            echo "AI service health check failed"
            exit 1
          fi
          
          echo "All health checks passed"

      - name: Run production smoke tests
        run: pnpm test:smoke --baseURL=https://moxmuse.com

      - name: Performance verification
        run: |
          # Run lighthouse CI for performance verification
          npx lhci autorun --config=.lighthouserc.json || echo "Performance check completed with warnings"

      - name: Deployment success notification
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        with:
          status: success
          text: |
            🚀 Production deployment successful!
            
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            Health checks: ✅ Passed
            Performance: ✅ Verified
            
            URL: https://moxmuse.com
        

  # Automated Rollback on Failure
  rollback-on-failure:
    name: Automated Rollback
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure() && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get previous successful deployment
        id: get-previous
        run: |
          # Get the previous successful deployment from Vercel
          PREVIOUS_DEPLOYMENT=$(curl -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&state=READY&limit=2" \
            | jq -r '.deployments[1].uid')
          echo "previous_deployment=$PREVIOUS_DEPLOYMENT" >> $GITHUB_OUTPUT

      - name: Rollback to previous deployment
        run: |
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}" \
            -d '{"targets": {"production": {"id": "${{ steps.get-previous.outputs.previous_deployment }}"}}}'

      - name: Verify rollback
        continue-on-error: true
        run: |
          sleep 30
          curl -f https://moxmuse.com/api/health || echo "Health check failed (post-rollback). Verify manually." 

      - name: Rollback notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        with:
          status: failure
          text: |
            🔄 Automated rollback executed!
            
            Failed deployment: ${{ github.sha }}
            Rolled back to: ${{ steps.get-previous.outputs.previous_deployment }}
            
            Please investigate the deployment failure.

  # Deployment Monitoring and Alerting
  post-deployment-monitoring:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success() && github.ref == 'refs/heads/main'

    steps:
      - name: Setup monitoring alerts
        run: |
          # Enable enhanced monitoring for the next 2 hours
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.MONITORING_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.monitoring.com/v1/alerts/enhance" \
            -d '{
              "duration": "2h",
              "deployment_id": "${{ github.sha }}",
              "thresholds": {
                "error_rate": 0.01,
                "response_time_p95": 2000,
                "availability": 0.999
              }
            }'

      - name: Schedule deployment verification
        run: |
          # Schedule verification checks for the next 24 hours
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.MONITORING_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.monitoring.com/v1/checks/schedule" \
            -d '{
              "deployment_id": "${{ github.sha }}",
              "checks": [
                {"type": "health", "interval": "5m", "duration": "24h"},
                {"type": "performance", "interval": "15m", "duration": "24h"},
                {"type": "user_journey", "interval": "30m", "duration": "24h"}
              ]
            }'

      - name: Final deployment report
        run: |
          echo "Deployment completed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed at: $(date)"
          echo "Monitoring enabled for 24 hours"